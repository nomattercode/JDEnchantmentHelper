[package]
name = "jd-enchantment-helper"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "Diagnostic desktop tooling for a Jade Dynasty inventory/enchantment helper"
license = "MIT"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
opencv = { version = "0.94.4", default-features = false, features = ["clang-runtime", "imgcodecs", "imgproc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
