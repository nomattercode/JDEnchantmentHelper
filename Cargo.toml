[package]
name = "jd-enchantment-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Desktop UI shell for Jade Dynasty enchantment helper"
license = "MIT"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
